[project]
name = "chunky"
version = "1.0.0"
description = "RAG API for optional PDF-grounded question answering"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "pypdf==6.0.0",
  "openai==1.107.1",
  "chromadb==1.0.20",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
